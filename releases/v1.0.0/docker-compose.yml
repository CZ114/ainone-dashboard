# AinOne Dashboard — Docker Compose
# =============================================================================
# NOTE: The Python backend (pyserial, bleak) and ESP32 USB/BLE communication
# require host-network access. This compose file is primarily for the
# Node.js Claude backend + frontend serving in a containerised environment.
#
# For full local development (recommended), use start.bat / start.sh instead.
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Python FastAPI Backend — port 8080
  # Handles serial/BLE/UDP sensor data and WebSocket streaming.
  # ---------------------------------------------------------------------------
  backend:
    image: python:3.11-slim
    container_name: esp32-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    environment:
      - SERIAL_BAUD_RATE=115200
      - AUDIO_PORT=8888
    # Note: USB/BLE access requires --privileged and host networking.
    # macOS/Windows: USB forwarding must be configured in Docker Desktop settings.
    network_mode: host
    command: >
      bash -c "pip install -r requirements.txt --quiet
               && python -u run.py"

  # ---------------------------------------------------------------------------
  # Node.js Claude Backend — port 3000
  # Web UI for Claude Code CLI with streaming chat.
  # ---------------------------------------------------------------------------
  claude-backend:
    image: node:20-slim
    container_name: esp32-claude-backend
    working_dir: /app
    volumes:
      - ./backend/claude:/app
      - ~/.claude:/root/.claude:ro   # read-only mount for Claude CLI config
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DEBUG=false
    network_mode: host
    command: >
      bash -c "npm install
               && npm run build
               && npm start"

  # ---------------------------------------------------------------------------
  # React Frontend — port 5173
  # Vite dev server with hot reload. Use for development only.
  # For production, build the static files and serve via nginx.
  # ---------------------------------------------------------------------------
  frontend:
    image: node:20-slim
    container_name: esp32-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    network_mode: host
    command: >
      bash -c "npm install
               && npm run dev -- --host 0.0.0.0"
